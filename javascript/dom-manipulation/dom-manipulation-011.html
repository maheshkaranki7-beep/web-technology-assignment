<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a live character counter for a textarea</h1><p>Working JavaScript practical: Create a live character counter for a textarea.</p></div>
<div class="panel demo"><div id='count' class='result' style='font-size:2rem'>0</div><button class='btn' onclick='count.textContent=+count.textContent+1'>+</button><button class='btn secondary' onclick='count.textContent=+count.textContent-1'>−</button></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
