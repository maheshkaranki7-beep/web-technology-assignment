<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to check whether a number is a palindrome</h1><p>Working JavaScript practical: Write a program to check whether a number is a palindrome.</p></div>
<div class="panel demo"><input id='n' value='121'><button class='btn' onclick='let s=n.value;out.textContent=s===s.split("").reverse().join("")?"Palindrome":"Not Palindrome"'>Check</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
