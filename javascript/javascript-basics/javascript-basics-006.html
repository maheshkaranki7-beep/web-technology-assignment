<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to find the factorial of a number</h1><p>Working JavaScript practical: Write a program to find the factorial of a number.</p></div>
<div class="panel demo"><input id='n' type='number' value='5'><button class='btn' onclick='let x=+n.value,r=1;for(let i=2;i<=x;i++)r*=i;out.textContent=r'>Factorial</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
