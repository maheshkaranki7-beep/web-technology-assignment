<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a JavaScript program to perform arithmetic operations</h1><p>Working JavaScript practical: Write a JavaScript program to perform arithmetic operations.</p></div>
<div class="panel demo"><div class='row'><input id='a' type='number' value='12'><input id='b' type='number' value='4'><button class='btn' onclick='calc()'>Calculate</button></div><div id='out' class='result'></div><script>function calc(){let a=+document.getElementById("a").value,b=+document.getElementById("b").value;out.textContent=`+ ${a+b} | − ${a-b} | × ${a*b} | ÷ ${b?a/b:"undefined"}`}</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
