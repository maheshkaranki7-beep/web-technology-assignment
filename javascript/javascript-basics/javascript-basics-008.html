<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to check whether a number is prime</h1><p>Working JavaScript practical: Write a program to check whether a number is prime.</p></div>
<div class="panel demo"><input id='n' type='number' value='29'><button class='btn' onclick='let x=+n.value,p=x>1;for(let i=2;i<=Math.sqrt(x);i++)if(x%i===0)p=false;out.textContent=p?"Prime":"Not Prime"'>Check</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
