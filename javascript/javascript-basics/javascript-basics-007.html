<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to generate the Fibonacci series</h1><p>Working JavaScript practical: Write a program to generate the Fibonacci series.</p></div>
<div class="panel demo"><input id='n' type='number' value='8'><button class='btn' onclick='let c=+n.value,a=0,b=1,s=[];for(let i=0;i<c;i++){s.push(a);[a,b]=[b,a+b]}out.textContent=s.join(", ")'>Generate</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
