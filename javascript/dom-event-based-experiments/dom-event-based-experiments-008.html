<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a number guessing game</h1><p>Working JavaScript practical: Create a number guessing game.</p></div>
<div class="panel demo"><p>Guess a number from 1–10.</p><input id='g' type='number' min='1' max='10'><button class='btn' onclick='check()'>Guess</button><div id='out' class='result'></div><script>let target=Math.floor(Math.random()*10)+1;function check(){out.textContent=(+g.value===target)?"Correct!":"Try again."}</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
