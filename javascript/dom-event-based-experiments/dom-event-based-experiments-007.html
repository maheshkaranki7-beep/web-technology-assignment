<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a simple calculator using HTML, CSS, and JavaScript</h1><p>Working JavaScript practical: Create a simple calculator using HTML, CSS, and JavaScript.</p></div>
<div class="panel demo"><div class='row'><input id='a' type='number' value='10'><select id='op'><option>+</option><option>-</option><option>*</option><option>/</option></select><input id='b' type='number' value='5'><button class='btn' onclick='let x=+a.value,y=+b.value;out.textContent=op.value==="+"?x+y:op.value==="-"?x-y:op.value==="*" ? x*y : x/y'>=</button></div><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
