<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to check whether a number is a perfect number</h1><p>Working JavaScript practical: Write a program to check whether a number is a perfect number.</p></div>
<div class="panel demo"><input id='n' value='28'><button class='btn' onclick='let n=+this.previousElementSibling.value,s=0;for(let i=1;i<n;i++)if(n%i===0)s+=i;out.textContent=s===n?"Perfect":"Not Perfect"'>Check</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
