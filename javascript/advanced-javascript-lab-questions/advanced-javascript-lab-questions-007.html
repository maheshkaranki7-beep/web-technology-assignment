<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Display API data dynamically on a webpage</h1><p>Working JavaScript practical: Display API data dynamically on a webpage.</p></div>
<div class="panel demo"><button class='btn' onclick='load()'>Fetch API Data</button><pre id='out'></pre><script>async function load(){out.textContent="Loading...";try{let r=await fetch("https://jsonplaceholder.typicode.com/todos/1");out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent="API request failed: "+e.message}}</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
