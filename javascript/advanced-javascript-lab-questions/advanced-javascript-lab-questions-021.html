<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to merge two arrays</h1><p>Working JavaScript practical: Write a program to merge two arrays.</p></div>
<div class="panel demo"><input id='a' value='1,2,3'><input id='b' value='4,5,6'><button class='btn' onclick='out.textContent=[...a.value.split(","),...b.value.split(",")].join(", ")'>Merge</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
