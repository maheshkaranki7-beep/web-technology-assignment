<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Write a program to remove duplicate elements from an array</h1><p>Working JavaScript practical: Write a program to remove duplicate elements from an array.</p></div>
<div class="panel demo"><input id='n' value='1,2,2,3,3,4'><button class='btn' onclick='out.textContent=[...new Set(n.value.split(","))].join(", ")'>Remove Duplicates</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
