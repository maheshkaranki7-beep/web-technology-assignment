<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a form that calculates and displays age from date of birth</h1><p>Working JavaScript practical: Create a form that calculates and displays age from date of birth.</p></div>
<div class="panel demo"><input id='dob' type='date'><button class='btn' onclick='let d=new Date(dob.value),n=new Date(),age=n.getFullYear()-d.getFullYear()-((n.getMonth()<d.getMonth())||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()));out.textContent="Age: "+age'>Calculate Age</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
