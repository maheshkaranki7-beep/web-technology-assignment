<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a strong password validator</h1><p>Working JavaScript practical: Create a strong password validator.</p></div>
<div class="panel demo"><input id='pw' type='password' placeholder='Password'><div id='out' class='result'></div><script>pw.oninput=()=>{let p=pw.value,s=(p.length>=8)+( /[A-Z]/.test(p))+( /[0-9]/.test(p))+( /[^A-Za-z0-9]/.test(p));out.textContent="Strength score: "+s+"/4"}</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
