<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a stopwatch</h1><p>Working JavaScript practical: Create a stopwatch.</p></div>
<div class="panel demo"><div id='sw' class='result' style='font-size:2rem'>0.0 s</div><button class='btn' onclick='start()'>Start</button> <button class='btn secondary' onclick='stop()'>Stop</button> <button class='btn secondary' onclick='reset()'>Reset</button><script>let tm,s=0;function start(){if(!tm)tm=setInterval(()=>{s+=.1;sw.textContent=s.toFixed(1)+" s"},100)}function stop(){clearInterval(tm);tm=null}function reset(){stop();s=0;sw.textContent="0.0 s"}</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
