<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Store multiple values using localStorage</h1><p>Working JavaScript practical: Store multiple values using localStorage.</p></div>
<div class="panel demo"><input id='value' value='Mahesh'><button class='btn' onclick='localStorage.setItem("labValue",value.value);render()'>Save</button><button class='btn secondary' onclick='localStorage.removeItem("labValue");render()'>Delete</button><div id='out' class='result'></div><script>function render(){out.textContent=localStorage.getItem("labValue")||"No saved value"}render()</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
