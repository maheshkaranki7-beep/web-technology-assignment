<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a shopping cart that persists after page refresh</h1><p>Working JavaScript practical: Create a shopping cart that persists after page refresh.</p></div>
<div class="panel demo"><div class='row'><input id='item' placeholder='Enter item/value'><button class='btn' onclick='save()'>Save</button></div><ul id='list'></ul><script>let key="labItems";function save(){let a=JSON.parse(localStorage.getItem(key)||"[]");a.push(item.value);localStorage.setItem(key,JSON.stringify(a));item.value="";render()}function render(){list.innerHTML=JSON.parse(localStorage.getItem(key)||"[]").map((x,i)=>`<li>${i+1}. ${x}</li>`).join("")}render()</script></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
