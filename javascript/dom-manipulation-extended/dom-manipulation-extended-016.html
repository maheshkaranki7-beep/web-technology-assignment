<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Edit table data dynamically</h1><p>Working JavaScript practical: Edit table data dynamically.</p></div>
<div class="panel demo"><button class='btn' onclick='let rows=[[1,"Mahesh"],[2,"Student"],[3,"CSE"]];out.innerHTML="<table><tr><th>ID</th><th>Value</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+"</table>"'>Create Table</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
