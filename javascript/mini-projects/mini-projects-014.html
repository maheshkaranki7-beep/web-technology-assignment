<main class="container"><div class="hero"><span class="badge">JavaScript Programs</span><h1>Create a random password generator</h1><p>Working JavaScript practical: Create a random password generator.</p></div>
<div class="panel demo"><button class='btn' onclick='let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";out.textContent=Array.from({length:12},()=>c[Math.floor(Math.random()*c.length)]).join("")'>Generate Password</button><div id='out' class='result'></div></div></main><footer>Practical Programs Website • Mahesh Karanki</footer><script src="../../assets/theme.js"></script><script src="../../assets/lab.js"></script></body></html>
